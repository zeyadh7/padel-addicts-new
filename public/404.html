<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Padel Addicts</title>
    <script>
      // GitHub Pages serves this file for any unknown path (e.g. /repo/tournaments/123).
      // It rewrites the path into a query string and sends the visitor to the app's index.html,
      // which then restores the clean URL. See https://github.com/rafgraph/spa-github-pages
      //
      // segmentCount = number of path segments that belong to the site root:
      //   1 -> project site:  https://<org>.github.io/<repo>/
      //   0 -> user/org site: https://<org>.github.io/  (repo named <org>.github.io)
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
